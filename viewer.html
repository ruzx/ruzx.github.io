<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChemEdit Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/smiles-drawer@2.1.8/dist/smiles-drawer.min.js"></script>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; background: #fbfbfb; }
        .molecule-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; margin-bottom: 20px; text-align: center; }
        .footer-promo { font-size: 0.9em; color: #666; text-align: center; }
        .footer-promo a { color: #167782; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <main class="container" style="max-width: 600px;">
        <div class="molecule-box">
            <h4 style="color: #333; margin-bottom: 10px;">Shared Structure</h4>
            <canvas id="molecule-canvas" width="400" height="400"></canvas>
            <div id="error-msg" style="display:none; color: #d9534f; padding: 20px;">Invalid SMILES string.</div>
        </div>

        <div class="footer-promo">
            <p>Shared via <a href="https://github.com/katananananna/obsidian-chemedit" target="_blank">ChemEdit</a></p>
            <p>Created by <a href="/">Ruzal Sitdikov</a></p>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const hash = window.location.hash;
            if (hash.startsWith('#smi=')) {
                const smiles = decodeURIComponent(hash.substring(5));
                const options = { width: 400, height: 400, compactDrawing: false };
                const smilesDrawer = new SmilesDrawer.Drawer(options);
                
                SmilesDrawer.parse(smiles, function(tree) {
                    smilesDrawer.draw(tree, 'molecule-canvas', 'light', false);
                }, function(err) {
                    document.getElementById('molecule-canvas').style.display = 'none';
                    document.getElementById('error-msg').style.display = 'block';
                });
            } else {
                document.getElementById('molecule-canvas').style.display = 'none';
                document.getElementById('error-msg').innerText = "No molecule data provided.";
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
