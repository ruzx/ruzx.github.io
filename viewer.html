<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChemEdit Viewer</title>
    <!-- CSS Framework -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    
    <!-- 2D Renderer (v1.0.10) -->
    <script src="https://unpkg.com/smiles-drawer@1.0.10/dist/smiles-drawer.min.js"></script>
    
    <!-- Interactive Molecule Editor (JSME) -->
    <script type="text/javascript" src="https://jsme-editor.github.io/dist/jsme/jsme.nocache.js"></script>
    
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; background: #fbfbfb; }
        .molecule-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; margin-bottom: 20px; text-align: center; width: 100%; max-width: 600px; }
        .footer-promo { font-size: 0.9em; color: #666; text-align: center; }
        .footer-promo a { color: #167782; text-decoration: none; font-weight: bold; }
        #jsme_container { width: 100%; height: 350px; display: none; }
        .toolbar { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        
        /* Container for reactions which might be wide */
        #draw-container { width: 100%; display: flex; justify-content: center; align-items: center; min-height: 300px; overflow-x: auto; padding: 10px; }
    </style>
</head>
<body>
    <main class="container" style="max-width: 650px;">
        <div class="molecule-box">
            <h4 id="title" style="color: #333; margin-bottom: 10px;">Shared Structure</h4>
            
            <!-- Static Viewer Container -->
            <div id="draw-container">
                <canvas id="molecule-canvas" width="400" height="400"></canvas>
            </div>
            
            <!-- Interactive Editor -->
            <div id="jsme_container"></div>

            <div id="error-msg" style="display:none; color: #d9534f; padding: 10px; font-size: 13px;"></div>

            <!-- Toolbar -->
            <div class="toolbar">
                <button id="edit-btn" class="outline" style="padding: 4px 12px; font-size: 14px;">✏️ Edit Structure</button>
                <button id="copy-btn" class="outline" style="padding: 4px 12px; font-size: 14px; display: none;">📋 Copy New SMILES</button>
            </div>
        </div>

        <div class="footer-promo">
            Shared via <a href="https://github.com/ruzx/obsidian-chemedit" target="_blank">ChemEdit</a> • 
            <a href="/about.html">About</a>
        </div>
    </main>

    <script>
        let currentSmiles = "";
        let jsmeApplet = null;

        // Required callback for JSME editor initialization
        function jsmeOnLoad() {
            // Ready
        }

        document.addEventListener("DOMContentLoaded", function() {
            const hash = window.location.hash;
            
            // Load structure from URL
            if (hash.startsWith('#smi=')) {
                currentSmiles = decodeURIComponent(hash.substring(5));
                drawSmiles(currentSmiles);
            } else {
                showError("No molecule data provided in the link.");
            }

            // Edit Button Click Logic
            document.getElementById('edit-btn').addEventListener('click', function() {
                openEditor();
            });

            // Copy Button Click Logic
            document.getElementById('copy-btn').addEventListener('click', function() {
                if (jsmeApplet) {
                    const newSmiles = jsmeApplet.smiles();
                    navigator.clipboard.writeText(newSmiles);
                    const originalText = this.innerText;
                    this.innerText = "✅ Copied!";
                    setTimeout(() => { this.innerText = originalText; }, 2000);
                }
            });
        });

        // Opens the JSME interactive editor
        function openEditor() {
            document.getElementById('draw-container').style.display = 'none';
            document.getElementById('edit-btn').style.display = 'none';
            
            document.getElementById('jsme_container').style.display = 'block';
            document.getElementById('copy-btn').style.display = 'inline-block';
            document.getElementById('title').innerText = "Edit Structure";

            if (!jsmeApplet) {
                jsmeApplet = new JSApplet.JSME("jsme_container", "100%", "350px");
            }
            // Load the SMILES into the editor
            jsmeApplet.readGenericMolecularInput(currentSmiles);
        }

        // Rendering function using stable SmilesDrawer v1
        function drawSmiles(smiles) {
            try {
                if (smiles.includes('>')) {
                    // --- REACTION RENDERING ---
                    document.getElementById('molecule-canvas').style.display = 'none';
                    
                    // Create a dynamic div for the reaction to draw into
                    const rxnContainer = document.createElement('div');
                    rxnContainer.id = 'rxn-canvas-container';
                    rxnContainer.style.display = 'flex';
                    rxnContainer.style.alignItems = 'center';
                    rxnContainer.style.justifyContent = 'center';
                    
                    document.getElementById('draw-container').appendChild(rxnContainer);

                    // Make the individual molecules slightly smaller so the whole reaction fits well
                    const rxnOptions = { width: 250, height: 250, compactDrawing: false };
                    const drawer = new SmilesDrawer.ReactionDrawer(rxnOptions);
                    
                    SmilesDrawer.parseReaction(smiles, function(tree) {
                        drawer.draw(tree, 'rxn-canvas-container', 'light', false);
                    }, function(err) {
                        console.warn("Parse warning:", err);
                        showError("Syntax error in Reaction string. Fallback to editor.");
                        openEditor(); 
                    });
                } else {
                    // --- SINGLE MOLECULE RENDERING ---
                    const options = { width: 400, height: 400, compactDrawing: false };
                    const drawer = new SmilesDrawer.Drawer(options);
                    
                    SmilesDrawer.parse(smiles, function(tree) {
                        drawer.draw(tree, 'molecule-canvas', 'light', false);
                    }, function(err) {
                        console.warn("Parse warning:", err);
                        showError("Syntax error in SMILES string. Fallback to editor.");
                        openEditor(); 
                    });
                }
            } catch (e) {
                console.error("Render error:", e);
                showError("Library error. Fallback to editor.");
                openEditor(); 
            }
        }

        function showError(msg) {
            document.getElementById('error-msg').innerText = msg;
            document.getElementById('error-msg').style.display = 'block';
        }
    </script>
</body>
</html>
